name: Playwright Automation Tests

on:

  # Run when code is pushed
  # push:
  #   branches:
  #     - main
  #     - develop

  # Run when Pull Request is created/updated
  # pull_request:
  #   branches:
  #     - main
  #     - develop

  # Run automatically every day at 8:00 AM IST
  # schedule:
  #   - cron: "30 2 * * *"

  # Run manually
  workflow_dispatch:
    inputs:

      environment:
        description: "Select Environment"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - uat
          - production

      # test_suite:
      #   description: "Select Test Suite"
      #   required: true
      #   default: "smoke"
      #   type: choice
      #   options:
      #     - smoke
      #     - regression
      #     - all

      browser:
        description: "Select Browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit


jobs:

  playwright-tests:

    runs-on: ubuntu-latest

    steps:

      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4


      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # Install dependencies
      - name: Install Dependencies
        run: npm ci


      # Install Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps


      # Set Environment
      - name: Set Environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TEST_ENV=${{ inputs.environment }}" >> $GITHUB_ENV
          else
            echo "TEST_ENV=qa" >> $GITHUB_ENV
          fi


      # Run Smoke Tests
      # - name: Run Smoke Tests
      #   if: |
      #     github.event_name != 'workflow_dispatch' ||
      #     inputs.test_suite == 'smoke'
      #   run: |
      #     npx playwright test --grep "@smoke"


      # Run Regression Tests
      - name: Run Regression Tests
        if: |
          github.event_name == 'workflow_dispatch' &&
          inputs.test_suite == 'regression'
        run: |
          npx playwright test --grep "@regression"


      # Run All Tests
      - name: Run All Tests
        if: |
          github.event_name == 'workflow_dispatch' &&
          inputs.test_suite == 'all'
        run: |
          npx playwright test


      # Upload Playwright Report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30


      # Send Email
      # - name: Send Email Notification
      #   if: always()
      #   uses: dawidd6/action-send-mail@v6
      #   with:

      #     server_address: smtp.gmail.com
      #     server_port: 465

      #     username: ${{ secrets.SMTP_USERNAME }}
      #     password: ${{ secrets.SMTP_PASSWORD }}

      #     subject: |
      #       Playwright Test Execution - ${{ job.status }}

      #     to: |
