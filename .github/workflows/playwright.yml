name: Playwright Automation Test Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "30 3 * * 1-5"

  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "qa"
        type: choice
        options:
          - dev
          - qa
          - staging
          - production

      test_type:
        description: "Select Test Type"
        required: true
        default: "regression"
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - all

      browser:
        description: "Select Browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      test_suite:
        description: "Select Test Suite"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - login
          - booking
          - checkout

      headless:
        description: "Run Browser in Headless Mode?"
        required: true
        default: true
        type: boolean

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Display Test Configuration
        run: |
          echo "Environment: ${{ inputs.environment || 'qa' }}"
          echo "Test Type: ${{ inputs.test_type || 'regression' }}"
          echo "Browser: ${{ inputs.browser || 'chromium' }}"
          echo "Test Suite: ${{ inputs.test_suite || 'all' }}"
          echo "Headless: ${{ inputs.headless || 'true' }}"

      - name: Run Playwright Tests
        run: |
          npx playwright test \
            --project="${{ inputs.browser || 'chromium' }}"

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Screenshots and Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-videos
          path: |
            test-results/
            screenshots/
            videos/
          if-no-files-found: ignore

      - name: Test Summary
        if: always()
        run: |
          echo "## Playwright Test Execution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment || 'qa' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | ${{ inputs.test_type || 'regression' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | ${{ inputs.browser || 'chromium' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | ${{ inputs.test_suite || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Headless | ${{ inputs.headless || 'true' }} |" >> $GITHUB_STEP_SUMMARY